name: Build armeabi-v7a APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and Platform
        run: |
          sdkmanager "platforms;android-37" "ndk;27.2.12479018"
          yes | sdkmanager --licenses || true

      - name: Build 32-bit APK only
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug \
            -PtargetAbi=armeabi-v7a \
            --no-daemon \
            --stacktrace

      - name: Verify single ABI APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/AVBox_debug_v7a.apk"
          if [ ! -f "$APK" ]; then
            echo "APK not found: $APK"
            find app/build/outputs/apk -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK native libs:"
          unzip -Z1 "$APK" | grep '^lib/' || true

          if unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/'; then
            echo "ERROR: arm64-v8a library detected; this is not a single 32-bit APK."
            exit 1
          fi

          if ! unzip -Z1 "$APK" | grep -q '^lib/armeabi-v7a/'; then
            echo "ERROR: armeabi-v7a library missing."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AVBox-armeabi-v7a-debug
          path: app/build/outputs/apk/debug/AVBox_debug_v7a.apk
          if-no-files-found: error
          retention-days: 14
