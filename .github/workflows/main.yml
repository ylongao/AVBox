name: Build armeabi-v7a APK (No Xunlei)
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and Platform
        run: |
          sdkmanager "platforms;android-34" "ndk;26.2.11394342"
          yes | sdkmanager --licenses || true

      - name: Build 32-bit APK (Xunlei disabled)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug \
            -PabiFilter=armeabi-v7a \
            --no-daemon \
            --stacktrace

      - name: Verify single ABI APK
        shell: bash
        run: |
          set -euo pipefail
          APK_FILES=$(find app/build/outputs/apk/debug -name "*.apk")
          if [ -z "$APK_FILES" ]; then
            echo "ERROR: No APK generated!"
            exit 1
          fi
          APK=$(echo "$APK_FILES" | head -n1)
          echo "Found APK: $APK"

          echo "APK native libs:"
          unzip -Z1 "$APK" | grep '^lib/' || true

          if unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/'; then
            echo "ERROR: arm64-v8a library detected; not pure 32-bit APK."
            exit 1
          fi
          if ! unzip -Z1 "$APK" | grep -q '^lib/armeabi-v7a/'; then
            echo "ERROR: armeabi-v7a library missing."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AVBox-armeabi-v7a-debug-no-xunlei
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
